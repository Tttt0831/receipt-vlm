# Receipt-VLM 训练配置
# 目标: 在合成数据上训练票据抽取模型

stage:
  name: "receipt_vlm_training"
  description: "票据VLM训练 - 合成数据"

# 模型配置（视觉编码器；离线/CPU 可改为 "fallback"，也可用 CLI --vision 覆盖）
model:
  vision_model_name: "google/siglip2-base-patch16-naflex"

# 数据集配置 (5000/500/500 划分)
data:
  train_datasets: ["synthetic"]  # 合成票据数据集
  val_datasets: ["synthetic"]
  train_path: "data/synthetic/train.jsonl"
  val_path: "data/data/synthetic/val.jsonl"

# 训练超参数
training:
  epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1e-4
  warmup_steps: 100
  weight_decay: 0.01
  max_grad_norm: 1.0

  # 优化器配置
  optimizer: "adamw"
  scheduler: "cosine"

  # 混合精度训练
  mixed_precision: "bf16"

  # 模型编译
  use_torch_compile: true

  # 梯度检查点 (节省显存)
  gradient_checkpointing: false

# 模型冻结策略
freezing:
  freeze_vision: true              # SigLIP2 全冻结
  freeze_llm_middle: true          # LLM 中间层冻结
  trainable_llm_layers: [0, -1]   # 只训练首层和末层
  train_projection: true           # Projection 层可训练

# 检查点保存
checkpointing:
  save_every_n_epochs: 1
  save_best_by: "value_match_rate"
  output_dir: "checkpoints"

# 日志和监控
logging:
  log_every_n_steps: 10
  eval_every_n_epochs: 1
  use_wandb: false
  wandb_project: "receipt-vlm"
  wandb_run_name: "receipt_vlm_training"

# 序列长度配置
sequence:
  max_sequence_length: 2048
  image_token_sequence_length: 576   # NaFlex 中等序列长度
